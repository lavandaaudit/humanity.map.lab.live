<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibonarium Heatmap - Ріалтайм</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
body { background:#000; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; }
h1 { margin-bottom:20px; font-size:2rem; color:#cfefff; text-align:center; }
.heatmap { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; width:95%; max-width:1000px; }
.cell { display:flex; flex-direction:column; justify-content:center; align-items:center; border-radius:10px; background:#111; font-weight:bold; font-size:1rem; position:relative; transition:all 0.3s ease; cursor:default; color:#fff; padding:5px; }
.cell.alert { animation:pulse 1s infinite; }
@keyframes pulse { 0% { box-shadow:0 0 5px #ff0000;} 50% { box-shadow:0 0 20px #ff0000;} 100% { box-shadow:0 0 5px #ff0000;} }
.tooltip { position:absolute; bottom:110%; background:rgba(0,0,0,0.8); padding:5px 8px; border-radius:5px; font-size:0.8rem; white-space:nowrap; opacity:0; pointer-events:none; transition:0.2s; }
.cell:hover .tooltip { opacity:1; }
.center-index { grid-column:1 / -1; font-size:1.5rem; border:2px solid #cfefff; background:#111; display:flex; justify-content:center; align-items:center; border-radius:15px; animation:glow 2s infinite alternate; margin-top:10px; }
@keyframes glow { 0% { box-shadow:0 0 5px #00ffdd;} 100% { box-shadow:0 0 20px #00ffdd;} }
.arrow { font-size:1rem; margin-left:3px; }
</style>
</head>
<body>

<h1>Ibonarium Heatmap</h1>
<div class="heatmap" id="heatmap"></div>

<script>
// ====== Індикатори: крипта, технології, соцмережі, події, погода, кібер, соціальні ======
const indicators = [
  // Криптовалюти
  {name:"💰 BTC/USD", type:"crypto", api:"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd"},
  {name:"💰 ETH/USD", type:"crypto", api:"https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd"},
  {name:"💰 DOGE/USD", type:"crypto", api:"https://api.coingecko.com/api/v3/simple/price?ids=dogecoin&vs_currencies=usd"},

  // Технології
  {name:"💻 GitHub React commits", type:"tech", api:"https://api.github.com/repos/facebook/react/commits?per_page=5"},
  {name:"💻 GitHub Python commits", type:"tech", api:"https://api.github.com/repos/python/cpython/commits?per_page=5"},

  // Соцмережі
  {name:"🌐 Reddit r/ukraine", type:"social", api:"https://www.reddit.com/r/ukraine/top.json?limit=5"},
  {name:"🌐 Reddit r/worldnews", type:"social", api:"https://www.reddit.com/r/worldnews/top.json?limit=5"},

  // Події
  {name:"📰 GDELT UA", type:"politics", api:"https://api.gdeltproject.org/api/v2/events/doc/doc?query=ukraine&format=json"},

  // Погода / екологія
  {name:"🌡️ Температура Київ", type:"weather", api:"https://api.open-meteo.com/v1/forecast?latitude=50.45&longitude=30.523&current_weather=true"},
  {name:"💨 Вітер Київ", type:"weather", api:"https://api.open-meteo.com/v1/forecast?latitude=50.45&longitude=30.523&current_weather=true"},
  {name:"🌫️ AQI Київ", type:"air", api:"https://api.waqi.info/feed/kiev/?token=demo"}, // demo token, для реального треба зареєструвати

  // Кібер / вразливості
  {name:"🛡️ CVE нові", type:"cyber", api:"https://cve.circl.lu/api/last"}, // повертає останні CVE, можна рахувати довжину

  // Соціальні / психологічні
  {name:"📈 Google Trends UA", type:"socialtrend", api:"https://trends.google.com/trends/api/dailytrends?hl=uk&geo=UA&ns=15"}
];

const heatmap = document.getElementById('heatmap');
const prevValues = Array(indicators.length).fill(null);

// ====== Створення клітинок ======
function createCells() {
  indicators.forEach((item,i)=>{
    const cell = document.createElement('div');
    cell.classList.add('cell');
    cell.id = 'cell-'+i;
    cell.innerHTML = `<div>${item.name}</div><div class="value">---</div><div class="arrow"></div><div class="tooltip">Loading...</div>`;
    heatmap.appendChild(cell);
  });

  const center = document.createElement('div');
  center.classList.add('center-index');
  center.id = 'center-index';
  center.textContent = "Стан системи: ---";
  heatmap.appendChild(center);
}

// ====== Отримання даних ======
async function fetchIndicator(item){
  try{
    const res = await fetch(item.api);
    const data = await res.json();
    switch(item.type){
      case "crypto": 
        return Object.values(data)[0].usd;
      case "tech": 
        return data.length;
      case "politics": 
        return data.totalCount || 0;
      case "social": 
        return data.data?.children?.length || 0;
      case "weather": 
        if(data.current_weather) return data.current_weather.temperature ?? 0;
        return 0;
      case "air":
        // AQI через demo token (приклад)
        return data.data?.aqi ?? 0;
      case "cyber":
        return data.length ?? 0; // кількість останніх CVE
      case "socialtrend":
        return data.default?.trendingSearchesDays?.[0]?.trendingSearches?.length ?? 0; // кількість трендів
      default: return 0;
    }
  } catch(e){ console.error(item.name,e); return 0; }
}

// ====== Колірна карта та стан ======
function getColorAndState(value, type){
  let color='#111', state=1;
  if(type=="crypto"){
    if(value < 20000){ color='#ff0000'; state=0; }
    else if(value < 40000){ color='#ffaa00'; state=1; }
    else{ color='#00ff00'; state=2; }
  }
  if(type=="tech" || type=="politics" || type=="social" || type=="socialtrend" || type=="cyber"){
    if(value > 10){ color='#00ff00'; state=2; } else{ color='#ffaa00'; state=1; }
  }
  if(type=="weather" || type=="air"){
    if(value < 0){ color='#ff0000'; state=0; }
    else if(value < 20){ color='#ffaa00'; state=1; }
    else{ color='#00ff00'; state=2; }
  }
  return {color,state};
}

// ====== Оновлення heatmap ======
async function updateHeatmap(){
  let totalState = 0;
  for(let i=0;i<indicators.length;i++){
    const val = await fetchIndicator(indicators[i]);
    const cell = document.getElementById('cell-'+i);
    const valueDiv = cell.querySelector('.value');
    const arrowDiv = cell.querySelector('.arrow');

    if(prevValues[i] !== null){
      arrowDiv.textContent = val > prevValues[i] ? '▲' : val < prevValues[i] ? '▼' : '';
    }
    prevValues[i] = val;

    valueDiv.textContent = val.toFixed ? val.toFixed(2) : val;
    cell.querySelector('.tooltip').textContent = val.toFixed ? val.toFixed(2) : val;

    const {color,state} = getColorAndState(val, indicators[i].type);
    cell.style.background=color;
    if(state===0) cell.classList.add('alert'); else cell.classList.remove('alert');
    totalState += state;
  }

  const avgState = totalState / indicators.length;
  let systemStatus='Норма';
  if(avgState<0.8) systemStatus='Погано';
  else if(avgState>1.5) systemStatus='Добре';
  document.getElementById('center-index').textContent=`Стан системи: ${systemStatus}`;
}

// ====== Ініціалізація ======
createCells();
updateHeatmap();
setInterval(updateHeatmap, 60000); // раз на хвилину
</script>
</body>
</html>
